<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Map Not Available</title>
  <desc id="desc">Fallback image used when the desktop launcher does not have a local PUBG map asset.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071018" />
      <stop offset="100%" stop-color="#163142" />
    </linearGradient>
  </defs>
  <rect width="1600" height="1600" fill="url(#bg)" />
  <rect x="120" y="120" width="1360" height="1360" rx="48" fill="none" stroke="#5fb7dc" stroke-width="8" stroke-dasharray="20 18" opacity="0.7" />
  <rect x="220" y="1020" width="1160" height="190" rx="28" fill="#08141c" opacity="0.92" />
  <text x="800" y="648" text-anchor="middle" fill="#f4fbff" font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="118" font-weight="700">MAP NOT AVAILABLE</text>
  <text x="800" y="768" text-anchor="middle" fill="#9fd8ee" font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="48" letter-spacing="6">Arenzyra OBSERVER LAUNCHER</text>
  <text x="800" y="1120" text-anchor="middle" fill="#f4fbff" font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Desktop asset fallback</text>
  <text x="800" y="1192" text-anchor="middle" fill="#97aeb9" font-family="Bahnschrift, Segoe UI, Arial, sans-serif" font-size="34">Local map artwork is missing. Widget rendering continues with a safe placeholder.</text>
</svg>
