<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Arenzyra PCOB Operator</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: "Inter", Arial, sans-serif; margin: 0; padding: 0; background: #0f172a; color: #e2e8f0; }
      .shell { max-width: 720px; margin: 0 auto; padding: 16px; }
      .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border: 1px solid #1e293b; background: #0b1220; border-radius: 10px; }
      .title { font-weight: 700; font-size: 16px; }
      .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid #1e293b; background: #0f172a; font-size: 12px; }
      .pill.green { background: #0f3d2e; color: #c7f7e3; border-color: #166534; }
      .pill.red { background: #3d0f1c; color: #fda4af; border-color: #be123c; }
      .controls { margin-top: 12px; padding: 16px; border: 1px solid #1e293b; background: #0b1220; border-radius: 10px; }
      .controls h2 { margin: 0 0 12px; font-size: 15px; }
      .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
      .field label { font-size: 12px; color: #cbd5e1; }
      .field input { padding: 8px 10px; border-radius: 8px; border: 1px solid #1e293b; background: #0f172a; color: #e2e8f0; }
      .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
      button { padding: 10px 12px; border-radius: 8px; border: 1px solid #1e293b; background: #1d4ed8; color: #e2e8f0; font-weight: 600; cursor: pointer; }
      button.secondary { background: transparent; color: #e2e8f0; }
      button.danger { background: #b91c1c; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .status-line { font-size: 13px; color: #cbd5e1; margin-top: 8px; }
      .header-actions { display: flex; align-items: center; gap: 8px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="bar">
        <div class="title">Arenzyra PCOB Operator</div>
        <div class="header-actions">
          <div id="connStatus" class="pill red">Disconnected</div>
          <div id="matchBadge" class="pill">Match: â€”</div>
          <button id="logoutBtn" class="secondary">Logout</button>
        </div>
      </div>

      <div class="controls">
        <h2>Match Control</h2>
        <div class="field">
          <label>Match ID</label>
          <input id="matchId" placeholder="MATCH_ID" />
        </div>
        <div class="field">
          <label>Backend URL</label>
          <input id="apiBaseUrl" placeholder="http://localhost:3000" />
        </div>
        <div class="field">
          <label>Backend Token</label>
          <input id="apiToken" placeholder="token" />
        </div>

        <div class="buttons">
          <button id="bindBtn">Connect to Match</button>
          <button id="unbindBtn" class="secondary">Disconnect</button>
          <button id="sendBtn">Send Live Data</button>
        </div>

        <div class="status-line" id="statusLine">Status: Not Bound</div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
