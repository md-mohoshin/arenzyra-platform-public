<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Overlay</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/socket.io/socket.io.js"></script>
    <script src="/common.js"></script>
    <style>
      .map-box {
        width: 100%;
        height: 70vh;
        border-radius: 12px;
        border: 1px dashed rgba(255, 255, 255, 0.2);
        background: radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.15), rgba(17, 24, 39, 0.9));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="badge" style="margin-bottom: 10px">Map Overlay</div>
      <div id="info" style="margin-bottom: 8px; color: #cbd5e1; font-size: 14px">Waiting…</div>
      <div class="map-box" id="mapBox">Map feed</div>
    </div>
    <script>
      const info = document.getElementById("info");
      const mapBox = document.getElementById("mapBox");
      const render = (data) => {
        const mapName = data?.mapName || data?.map || data?.name || "Map";
        const phase = data?.phase ?? data?.circlePhase ?? data?.phaseLabel ?? "?";
        const shrink = data?.nextShrink ?? data?.nextShrinkAt ?? data?.nextShrinkTime;
        info.textContent = `${mapName} · Phase ${phase} ${shrink ? "· Next shrink " + shrink : ""}`;
        mapBox.classList.add("fade-in");
        setTimeout(() => mapBox.classList.remove("fade-in"), 400);
      };
      window.overlayBus.on((payload) => {
        if (!payload || payload.overlay !== "map") return;
        if (payload.type === "overlay:hide") {
          info.textContent = "Hidden";
          return;
        }
        render(payload.data);
      });
    </script>
  </body>
</html>
