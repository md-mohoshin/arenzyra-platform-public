<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arenzyra System Launcher</title>
  <style>
    :root {
      --bg: #101314;
      --panel: #171d20;
      --panel-strong: #1d262a;
      --panel-soft: #12181b;
      --border: #2a3439;
      --text: #f3f7f8;
      --muted: #9eb1b8;
      --accent: #7bf0c8;
      --accent-strong: #4fcf9f;
      --danger: #ff7b72;
      --warning: #f7c76b;
      --running: #5fd68f;
      --starting: #8ab4ff;
      --stopped: #88949a;
      --error: #ff7b72;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(123, 240, 200, 0.18), transparent 30%),
        linear-gradient(180deg, #0f1416 0%, var(--bg) 45%, #0b0f11 100%);
      color: var(--text);
    }

    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.9fr);
      gap: 18px;
      padding: 20px;
      min-height: 100vh;
    }

    .panel {
      background: rgba(23, 29, 32, 0.9);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(10px);
    }

    .main-panel {
      padding: 22px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 22px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
    }

    .subhead {
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
      max-width: 720px;
    }

    .repo-root {
      margin: 0 0 22px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--panel-soft);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 12px;
      font: inherit;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease, border-color 120ms ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary-button {
      padding: 12px 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: #082019;
      font-weight: 700;
    }

    .secondary-button {
      padding: 10px 14px;
      background: var(--panel-soft);
      color: var(--text);
      border-color: var(--border);
    }

    .health-card {
      padding: 16px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(123, 240, 200, 0.08), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(123, 240, 200, 0.18);
      margin-bottom: 18px;
    }

    .health-card h2,
    .services-header h2,
    .logs-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .health-card p {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .services-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .service-card {
      padding: 16px;
      border-radius: 16px;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .service-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .service-card__title {
      margin: 0;
      font-size: 18px;
    }

    .service-card__meta,
    .service-card__detail,
    .service-card__command,
    .service-card__path {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .service-card__command,
    .service-card__path {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.04);
      word-break: break-all;
      font-family: Consolas, monospace;
    }

    .service-card__actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      padding: 7px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
    }

    .status-pill.is-running {
      background: rgba(95, 214, 143, 0.18);
      color: var(--running);
    }

    .status-pill.is-starting,
    .status-pill.is-unknown {
      background: rgba(138, 180, 255, 0.16);
      color: var(--starting);
    }

    .status-pill.is-stopped,
    .status-pill.is-stopping {
      background: rgba(136, 148, 154, 0.18);
      color: var(--stopped);
    }

    .status-pill.is-error {
      background: rgba(255, 123, 114, 0.18);
      color: var(--error);
    }

    .logs-header {
      margin-bottom: 12px;
    }

    .logs {
      margin: 0;
      padding: 14px;
      flex: 1;
      min-height: 0;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #0c1012;
      color: #d7e3e7;
      font-family: Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .side-panel {
        min-height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="panel main-panel">
      <p class="eyebrow">Arenzyra Control Plane</p>
      <h1>System Launcher</h1>
      <p class="subhead">
        Full health checks, current service paths, and direct start/stop control for the non-desktop Arenzyra stack.
      </p>
      <p id="repo-root" class="repo-root"></p>

      <div class="toolbar">
        <button id="run-health" class="primary-button" type="button">Run Full Health</button>
        <button id="start-all" class="secondary-button" type="button">Start All</button>
        <button id="restart-all" class="secondary-button" type="button">Restart All</button>
        <button id="stop-all" class="secondary-button" type="button">Stop All</button>
      </div>

      <section class="health-card" aria-live="polite">
        <h2>Health Status</h2>
        <p id="health-summary">Health check has not run yet.</p>
        <p id="health-stamp">No completed health check yet.</p>
      </section>

      <section>
        <div class="services-header">
          <h2>Managed Services</h2>
        </div>
        <div id="services" class="services-grid"></div>
      </section>
    </main>

    <aside class="panel side-panel">
      <div class="logs-header">
        <p class="eyebrow">Runtime Logs</p>
        <h2>Health + Service Output</h2>
      </div>
      <pre id="logs" class="logs"></pre>
    </aside>
  </div>

  <script src="renderer.js" defer></script>
</body>
</html>
