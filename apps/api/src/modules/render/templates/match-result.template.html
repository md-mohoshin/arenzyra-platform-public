<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arenzyra Match Result</title>
    <style>
      {{fontCssImport}}
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        font-family: {{fontFamily}};
        background: {{background}};
        color: {{textPrimary}};
      }
      .frame {
        width: 100%;
        height: 100%;
        padding: {{framePaddingTop}} {{framePaddingRight}} {{framePaddingBottom}} {{framePaddingLeft}};
        position: relative;
        overflow: hidden;
      }
      .shell {
        position: relative;
        height: 100%;
        padding: 28px;
        z-index: 10;
      }
      .overlay-layer {
        position: absolute;
        height: auto;
        max-width: none;
        object-fit: contain;
        pointer-events: none;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: {{headerMargin}};
      }
      .eyebrow {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: {{panel}};
        border: 1px solid {{border}};
        color: {{primaryColor}};
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .title {
        margin: 14px 0 0;
        font-size: {{titleSize}};
        font-weight: 800;
        line-height: 1.04;
        letter-spacing: 0;
      }
      .subtitle {
        margin-top: 8px;
        color: {{textMuted}};
        font-size: 16px;
      }
      .brand-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        border-radius: 20px;
        background: {{panel}};
        border: 1px solid {{border}};
        padding: 16px;
      }
      .brand-logo--empty {
        background: {{panel}};
      }
      .board {
        display: grid;
        grid-template-columns: repeat({{boardColumns}}, minmax(0, 1fr));
        gap: {{boardGap}};
      }
      .row {
        display: grid;
        grid-template-columns: 38px 30px minmax(0, 1fr) 42px 54px 54px;
        align-items: center;
        gap: 8px;
        min-height: {{rowMinHeight}};
        padding: {{rowPadding}};
        border-radius: {{rowRadius}};
        background: {{panel}};
        border: 1px solid {{border}};
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
      }
      .row-rank {
        color: {{primaryColor}};
        font-size: {{rowRankSize}};
        font-weight: 800;
        letter-spacing: 0;
      }
      .row-logo {
        width: 24px;
        height: 24px;
        object-fit: contain;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid {{border}};
        padding: 3px;
      }
      .row-team {
        min-width: 0;
        font-size: {{rowTitleSize}};
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-stat,
      .row-total {
        text-align: right;
        color: {{textPrimary}};
        font-size: {{rowMetaSize}};
        font-weight: 800;
        white-space: nowrap;
      }
      .row-total {
        color: {{primaryColor}};
        font-size: {{rowMetricSize}};
      }
    </style>
  </head>
  <body>
    <div class="frame">
      {{overlayLayersHtml}}
      <div class="shell">
        <div class="header">
          <div>
            <div class="eyebrow">{{eyebrow}}</div>
            <div class="title">{{matchName}}</div>
            {{subtitleHtml}}
          </div>
          {{logoHtml}}
        </div>
        <div class="board">{{rowsHtml}}</div>
      </div>
    </div>
  </body>
</html>
