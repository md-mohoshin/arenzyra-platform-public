<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arenzyra Lower Third</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: rgba(8, 12, 24, 0.05);
        --panel: rgba(6, 12, 26, 0.7);
        --border: rgba(255, 255, 255, 0.1);
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
        background: transparent;
        color: var(--text);
      }
      .status {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 12px;
        backdrop-filter: blur(6px);
      }
      .debug {
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 12px;
        line-height: 1.4;
        min-width: 220px;
        backdrop-filter: blur(6px);
      }
      .hidden {
        display: none;
      }
      #lowerThird {
        display: none;
        align-items: center;
        gap: 14px;
        padding: 14px 18px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--panel);
        backdrop-filter: blur(8px);
        max-width: 520px;
      }
      .photo {
        width: 88px;
        height: 88px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        flex-shrink: 0;
      }
      .photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .info {
        flex: 1;
        min-width: 0;
      }
      .name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .team {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .team img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 1px solid var(--border);
        object-fit: cover;
        background: rgba(255, 255, 255, 0.04);
      }
      .stats {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      .pill {
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.05);
        font-size: 13px;
        font-weight: 700;
      }
      .health {
        color: #4ade80;
      }
      .kills {
        color: var(--accent);
      }
      .dead {
        color: #f87171;
      }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="status" class="status">Connectingâ€¦</div>
    <div id="debug" class="debug hidden"></div>
    <div id="lowerThird">
      <div class="photo"><img id="photo" src="/assets/players/default-player.svg" alt="Player" /></div>
      <div class="info">
        <div class="name" id="playerName">Player</div>
        <div class="team">
          <img id="teamLogo" src="/assets/logos/default-logo.svg" alt="Team" />
          <span id="teamName">Team</span>
        </div>
        <div class="stats">
          <div class="pill kills" id="kills">Kills: 0</div>
          <div class="pill health" id="health">Health: --</div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const matchId = params.get("matchId") || "";
        const debug = params.get("debug") === "true";
        const apiHost = params.get("api") || window.location.origin;
        const statusEl = document.getElementById("status");
        const debugEl = document.getElementById("debug");
        const lower = document.getElementById("lowerThird");
        const photoEl = document.getElementById("photo");
        const nameEl = document.getElementById("playerName");
        const teamLogoEl = document.getElementById("teamLogo");
        const teamNameEl = document.getElementById("teamName");
        const killsEl = document.getElementById("kills");
        const healthEl = document.getElementById("health");
        const fallbackLogo = "/assets/logos/default-logo.svg";
        const fallbackPhoto = "/assets/players/default-player.svg";

        if (debug) {
          debugEl.classList.remove("hidden");
        }

        let socket = null;

        function connect() {
          statusEl.textContent = "Connectingâ€¦";
          socket = io(apiHost, {
            path: "/broadcast/socket.io",
            transports: ["websocket"],
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            query: matchId ? { matchId } : undefined,
          });

          socket.on("connect", () => {
            statusEl.textContent = "Connected";
            if (matchId) {
              socket.emit("broadcast:join", { matchId });
            }
          });

          socket.on("connect_error", () => {
            statusEl.textContent = "Connection error";
          });

          socket.on("disconnect", () => {
            statusEl.textContent = "Disconnected. Reconnectingâ€¦";
          });

          socket.on("broadcast:state", (state) => {
            renderState(state || {});
          });
        }

        function renderState(state) {
          statusEl.textContent = `Live â€¢ ${new Date(state.updatedAt || Date.now()).toLocaleTimeString()}`;
          const focus = state.focus;
          if (!focus) {
            lower.style.display = "none";
          } else {
            lower.style.display = "flex";
            nameEl.textContent = focus.name || "Player";
            teamNameEl.textContent = focus.teamName || "Team";
            killsEl.textContent = `Kills: ${focus.kills ?? 0}`;
            const healthVal = focus.health != null ? focus.health : focus.isAlive === false ? 0 : "--";
            const alive = focus.isAlive !== false;
            healthEl.textContent = `Health: ${healthVal}`;
            healthEl.className = `pill ${alive ? "health" : "dead"}`;
            setImage(photoEl, focus.photoUrl || fallbackPhoto, fallbackPhoto);
            setImage(teamLogoEl, focus.teamLogoUrl || fallbackLogo, fallbackLogo);
          }
          if (debug) {
            renderDebug(state);
          }
        }

        function renderDebug(state) {
          const health = state.health || {};
          const latency = health.avgLatencyMs != null ? `${health.avgLatencyMs} ms` : "n/a";
          const last = health.lastTelemetryAt ? new Date(health.lastTelemetryAt).toLocaleTimeString() : "n/a";
          const rate = health.eventsPerSec ? health.eventsPerSec.toFixed(2) : "0";
          const status = (health.status || "down").toUpperCase();
          debugEl.innerHTML = `
            <div><strong>Status:</strong> ${status}</div>
            <div><strong>Latency:</strong> ${latency}</div>
            <div><strong>Last packet:</strong> ${last}</div>
            <div><strong>Rate:</strong> ${rate} evt/s</div>
            <div><strong>Client:</strong> ${health.clientId || "n/a"}</div>
          `;
        }

        function setImage(el, url, fallback) {
          el.src = url || fallback;
          el.onerror = () => {
            if (el.src !== fallback) {
              el.src = fallback;
            }
          };
        }

        connect();
      })();
    </script>
  </body>
</html>
