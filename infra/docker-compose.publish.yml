x-default-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  proxy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      ACME_EMAIL: "${ACME_EMAIL:?REQUIRED ENV VARIABLE MISSING: ACME_EMAIL}"
      PUBLIC_WEB_HOST: "${PUBLIC_WEB_HOST:?REQUIRED ENV VARIABLE MISSING: PUBLIC_WEB_HOST}"
      PUBLIC_API_HOST: "${PUBLIC_API_HOST:?REQUIRED ENV VARIABLE MISSING: PUBLIC_API_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      default:
        ipv4_address: "${ARENZYRA_PROXY_IP:-172.30.50.2}"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?REQUIRED ENV VARIABLE MISSING: POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?REQUIRED ENV VARIABLE MISSING: POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-pubg_prod}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-pubg_prod}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    # The pinned Alpine image defines redis as 999:1000. Starting directly as
    # that account avoids its root entrypoint traversing a legacy 0700 AOF
    # directory after all Linux capabilities have deliberately been dropped.
    user: "999:1000"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-3gb}",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: unless-stopped

  api:
    image: "arenzyra-api:${ARENZYRA_RELEASE_ID:-unversioned}"
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        ARENZYRA_RELEASE_ID: "${ARENZYRA_RELEASE_ID:-}"
        ARENZYRA_SOURCE_DIGEST: "${ARENZYRA_SOURCE_DIGEST:-}"
        ARENZYRA_GIT_COMMIT: "${ARENZYRA_GIT_COMMIT:-}"
        ARENZYRA_BUILD_AT: "${ARENZYRA_BUILD_AT:-}"
        ARENZYRA_BUILD_SOURCE: "${ARENZYRA_BUILD_SOURCE:-publish}"
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:?REQUIRED ENV VARIABLE MISSING: TRUSTED_PROXY_IPS}"
      PORT: 3000
      DATABASE_URL: "${DATABASE_URL:?REQUIRED ENV VARIABLE MISSING: DATABASE_URL}"
      REDIS_URL: "redis://redis:6379"
      ENABLE_REDIS: "true"
      DISTRIBUTED_RATE_LIMIT_REQUIRED: "true"
      REDIS_READY_MAX_MEMORY_RATIO: "${REDIS_READY_MAX_MEMORY_RATIO:-0.85}"
      EVENT_BUS_MAX_PAYLOAD_BYTES: "${EVENT_BUS_MAX_PAYLOAD_BYTES:-524288}"
      EVENT_BUS_STREAM_MAXLEN: "${EVENT_BUS_STREAM_MAXLEN:-10000}"
      JWT_SECRET: "${JWT_SECRET:?REQUIRED ENV VARIABLE MISSING: JWT_SECRET}"
      IDP_CREDENTIAL_ENCRYPTION_KEY: "${IDP_CREDENTIAL_ENCRYPTION_KEY:?REQUIRED ENV VARIABLE MISSING: IDP_CREDENTIAL_ENCRYPTION_KEY}"
      PUBLIC_ORGANIZATION_APPLICATIONS_ENABLED: "false"
      SUPERADMIN_MFA_REQUIRED: "true"
      SUPERADMIN_MFA_ENCRYPTION_KEY: "${SUPERADMIN_MFA_ENCRYPTION_KEY:?REQUIRED ENV VARIABLE MISSING: SUPERADMIN_MFA_ENCRYPTION_KEY}"
      SUPERADMIN_MFA_RECOVERY_PEPPER: "${SUPERADMIN_MFA_RECOVERY_PEPPER:?REQUIRED ENV VARIABLE MISSING: SUPERADMIN_MFA_RECOVERY_PEPPER}"
      HEALTHCHECK_TOKEN: "${HEALTHCHECK_TOKEN:?REQUIRED ENV VARIABLE MISSING: HEALTHCHECK_TOKEN}"
      COLLECTOR_SECRET: "${COLLECTOR_SECRET:?REQUIRED ENV VARIABLE MISSING: COLLECTOR_SECRET}"
      PCOB_SECRET: "${PCOB_SECRET:?REQUIRED ENV VARIABLE MISSING: PCOB_SECRET}"
      PCOB_RAW_RETENTION_ACKED_EVENTS: "${PCOB_RAW_RETENTION_ACKED_EVENTS:-10000}"
      PCOB_RAW_RETENTION_STREAM_BYTES: "${PCOB_RAW_RETENTION_STREAM_BYTES:-268435456}"
      PCOB_RAW_RETENTION_MATCH_BYTES: "${PCOB_RAW_RETENTION_MATCH_BYTES:-2147483648}"
      PCOB_RAW_MAX_STREAMS_PER_MATCH: "${PCOB_RAW_MAX_STREAMS_PER_MATCH:-16}"
      PCOB_RAW_MAX_SEQUENCE_LOOKAHEAD: "${PCOB_RAW_MAX_SEQUENCE_LOOKAHEAD:-10000}"
      PCOB_RAW_HARD_MAX_EVENTS_PER_STREAM: "${PCOB_RAW_HARD_MAX_EVENTS_PER_STREAM:-20000}"
      PCOB_RAW_HARD_MAX_STREAM_BYTES: "${PCOB_RAW_HARD_MAX_STREAM_BYTES:-536870912}"
      PCOB_RAW_HARD_MAX_MATCH_BYTES: "${PCOB_RAW_HARD_MAX_MATCH_BYTES:-4294967296}"
      PCOB_RAW_PROCESSING_BATCH_SIZE: "${PCOB_RAW_PROCESSING_BATCH_SIZE:-500}"
      PCOB_RAW_PROCESSING_BATCH_BYTES: "${PCOB_RAW_PROCESSING_BATCH_BYTES:-67108864}"
      PCOB_RAW_PROCESSING_LEASE_MS: "${PCOB_RAW_PROCESSING_LEASE_MS:-60000}"
      PCOB_RAW_PROVIDER_TERMINAL_QUIET_MS: "${PCOB_RAW_PROVIDER_TERMINAL_QUIET_MS:-15000}"
      PCOB_RAW_PROCESSOR_SHUTDOWN_MS: "${PCOB_RAW_PROCESSOR_SHUTDOWN_MS:-20000}"
      PCOB_MAX_BODY_BYTES: "${PCOB_MAX_BODY_BYTES:-16777216}"
      PCOB_RAW_MAX_ENCODED_EVENT_BYTES: "${PCOB_RAW_MAX_ENCODED_EVENT_BYTES:-6291456}"
      PCOB_RAW_MAX_ENCODED_BATCH_BYTES: "${PCOB_RAW_MAX_ENCODED_BATCH_BYTES:-7340032}"
      PCOB_RAW_MAX_ORIGINAL_BATCH_BYTES: "${PCOB_RAW_MAX_ORIGINAL_BATCH_BYTES:-33554432}"
      # Development login-triggered bootstrap is forbidden in production.
      AUTH_DEV_BOOTSTRAP_ENABLED: "false"
      WEB_APP_ORIGIN: "${WEB_APP_ORIGIN:?REQUIRED ENV VARIABLE MISSING: WEB_APP_ORIGIN}"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?REQUIRED ENV VARIABLE MISSING: FRONTEND_ORIGIN}"
      API_BASE_URL: "${API_BASE_URL:?REQUIRED ENV VARIABLE MISSING: API_BASE_URL}"
      API_PUBLIC_URL: "${API_PUBLIC_URL:?REQUIRED ENV VARIABLE MISSING: API_PUBLIC_URL}"
      ASSET_BASE_URL: "${ASSET_BASE_URL:-${API_PUBLIC_URL}}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-}"
      SMTP_SECURE: "${SMTP_SECURE:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      APPLICATION_NOTIFY_EMAIL: "${APPLICATION_NOTIFY_EMAIL:-}"
      APPLICATION_NOTIFICATION_EMAIL: "${APPLICATION_NOTIFICATION_EMAIL:-}"
      ARENZYRA_SUPPORT_EMAIL: "${ARENZYRA_SUPPORT_EMAIL:-}"
      ARENZYRA_BILLING_REVIEW_EMAIL: "${ARENZYRA_BILLING_REVIEW_EMAIL:?REQUIRED ENV VARIABLE MISSING: ARENZYRA_BILLING_REVIEW_EMAIL}"
      ARENZYRA_WEB_URL: "${WEB_APP_ORIGIN}"
      PAYMENT_PROOF_RETENTION_DAYS: "${PAYMENT_PROOF_RETENTION_DAYS:-90}"
      BILLING_RESERVATION_LOCK_SECONDS: "${BILLING_RESERVATION_LOCK_SECONDS:-120}"
      BILLING_RESERVATION_RETENTION_HOURS: "${BILLING_RESERVATION_RETENTION_HOURS:-24}"
      BILLING_RESERVATION_CLEANUP_BATCH: "${BILLING_RESERVATION_CLEANUP_BATCH:-50}"
      BILLING_REVIEW_CLAIM_LEASE_MINUTES: "${BILLING_REVIEW_CLAIM_LEASE_MINUTES:-30}"
      BILLING_OUTBOX_CLAIM_SECONDS: "${BILLING_OUTBOX_CLAIM_SECONDS:-300}"
      BILLING_OUTBOX_WORKER_ENABLED: "true"
      BILLING_OUTBOX_WORKER_INTERVAL_SECONDS: "${BILLING_OUTBOX_WORKER_INTERVAL_SECONDS:-60}"
      BILLING_OUTBOX_WORKER_BATCH: "${BILLING_OUTBOX_WORKER_BATCH:-10}"
      BILLING_OUTBOX_SHUTDOWN_MS: "${BILLING_OUTBOX_SHUTDOWN_MS:-15000}"
      BILLING_SMTP_CONNECTION_TIMEOUT_MS: "${BILLING_SMTP_CONNECTION_TIMEOUT_MS:-5000}"
      BILLING_SMTP_GREETING_TIMEOUT_MS: "${BILLING_SMTP_GREETING_TIMEOUT_MS:-5000}"
      BILLING_SMTP_SOCKET_TIMEOUT_MS: "${BILLING_SMTP_SOCKET_TIMEOUT_MS:-10000}"
      ARENZYRA_API_SERVICE_TOKEN_SHA256: "${ARENZYRA_API_SERVICE_TOKEN_SHA256:-}"
      STUDIO_QA_SERVICE_TOKEN_SHA256: "${STUDIO_QA_SERVICE_TOKEN_SHA256:-}"
      ARENZYRA_API_SERVICE_ORGANIZATION_ID: "${ARENZYRA_API_SERVICE_ORGANIZATION_ID:-}"
      ARENZYRA_API_SERVICE_USER_ID: "${ARENZYRA_API_SERVICE_USER_ID:-}"
      ARENZYRA_API_SERVICE_USER_EMAIL: "${ARENZYRA_API_SERVICE_USER_EMAIL:-}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI:-}"
      DISCORD_INSTALL_STATE_SECRET: "${DISCORD_INSTALL_STATE_SECRET:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_IMPORT_POLLING: "${TELEGRAM_IMPORT_POLLING:-false}"
      YOUTUBE_CLIENT_ID: "${YOUTUBE_CLIENT_ID:-}"
      YOUTUBE_CLIENT_SECRET: "${YOUTUBE_CLIENT_SECRET:-}"
      YOUTUBE_REDIRECT_URI: "${YOUTUBE_REDIRECT_URI:-}"
      YOUTUBE_STATE_SECRET: "${YOUTUBE_STATE_SECRET:-}"
      YOUTUBE_TOKEN_ENCRYPTION_KEY_ID: "${YOUTUBE_TOKEN_ENCRYPTION_KEY_ID:?REQUIRED ENV VARIABLE MISSING: YOUTUBE_TOKEN_ENCRYPTION_KEY_ID}"
      YOUTUBE_TOKEN_ENCRYPTION_KEY: "${YOUTUBE_TOKEN_ENCRYPTION_KEY:?REQUIRED ENV VARIABLE MISSING: YOUTUBE_TOKEN_ENCRYPTION_KEY}"
      YOUTUBE_TOKEN_ENCRYPTION_PREVIOUS_KEYS: "${YOUTUBE_TOKEN_ENCRYPTION_PREVIOUS_KEYS:?REQUIRED ENV VARIABLE MISSING: YOUTUBE_TOKEN_ENCRYPTION_PREVIOUS_KEYS}"
      YOUTUBE_TOKEN_ENCRYPTION_LEGACY_V1_KEY: "${YOUTUBE_TOKEN_ENCRYPTION_LEGACY_V1_KEY:-}"
      PCOB_BASE_URL: "${PCOB_BASE_URL:-${OBSERVER_BASE_URL:-http://host.docker.internal:10086}}"
      SHADOW_API_BASE: "${SHADOW_API_BASE:-${OBSERVER_BASE_URL:-http://host.docker.internal:10086}}"
      MATCH_STATE_BASE: "${MATCH_STATE_BASE:-http://host.docker.internal:4000}"
      LIVE_SYNC_RESULTS_WRITE_ENABLED: "${LIVE_SYNC_RESULTS_WRITE_ENABLED:-}"
      MEDIA_AI_URL: "${MEDIA_AI_URL:-http://media-ai:5055}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_TTS_MODEL: "${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-4.1-mini}"
      OPENAI_VISION_DETAIL: "${OPENAI_VISION_DETAIL:-auto}"
      OPENAI_VISION_PREPROCESS: "${OPENAI_VISION_PREPROCESS:-true}"
      OPENAI_VISION_MAX_IMAGE_EDGE: "${OPENAI_VISION_MAX_IMAGE_EDGE:-2048}"
      OPENAI_VISION_IMAGE_QUALITY: "${OPENAI_VISION_IMAGE_QUALITY:-90}"
      OPENAI_VISION_ENHANCED_VARIANTS: "${OPENAI_VISION_ENHANCED_VARIANTS:-true}"
      OPENAI_VISION_MAX_IMAGE_VARIANTS: "${OPENAI_VISION_MAX_IMAGE_VARIANTS:-2}"
      OPENAI_VISION_ROW_CROPS: "${OPENAI_VISION_ROW_CROPS:-0}"
      OPENAI_VISION_CACHE: "${OPENAI_VISION_CACHE:-true}"
      OPENAI_VISION_CACHE_TTL_SECONDS: "${OPENAI_VISION_CACHE_TTL_SECONDS:-604800}"
      OCR_BASIC_FIRST: "${OCR_BASIC_FIRST:-true}"
      REALTIME_WIDGET_ALLOW_UNAUTHENTICATED_LOCAL: "false"
      REALTIME_WIDGET_ALLOW_ORG_BROADCAST_KEY: "false"
    depends_on:
      api-migrate:
        condition: service_completed_successfully
        required: false
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-uploads:/app/uploads
      - api-storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["node", "dist/main"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all([fetch('http://127.0.0.1:3000/health/live'),fetch('http://127.0.0.1:3000/health/ready',{headers:{'X-Healthcheck-Token':process.env.HEALTHCHECK_TOKEN}})]).then((responses)=>process.exit(responses.every((response)=>response.ok)?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    restart: unless-stopped

  api-migrate:
    profiles: ["migration"]
    image: "arenzyra-api:${ARENZYRA_RELEASE_ID:-unversioned}"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?REQUIRED ENV VARIABLE MISSING: MIGRATION_DATABASE_URL}"
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: "no"

  api-maintenance-idp-dry-run:
    profiles: ["maintenance"]
    image: "arenzyra-api:${ARENZYRA_RELEASE_ID:-unversioned}"
    user: "1000:1000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${MAINTENANCE_READ_DATABASE_URL:?REQUIRED ENV VARIABLE MISSING: MAINTENANCE_READ_DATABASE_URL}"
      IDP_CREDENTIAL_ENCRYPTION_KEY: "${IDP_CREDENTIAL_ENCRYPTION_KEY:?REQUIRED ENV VARIABLE MISSING: IDP_CREDENTIAL_ENCRYPTION_KEY}"
      ARENZYRA_EXPECTED_DATABASE_NAME: "${ARENZYRA_EXPECTED_DATABASE_NAME:-UNSEALED}"
      ARENZYRA_EXPECTED_DATABASE_OID: "${ARENZYRA_EXPECTED_DATABASE_OID:-0}"
      ARENZYRA_EXPECTED_DATABASE_SYSTEM_IDENTIFIER: "${ARENZYRA_EXPECTED_DATABASE_SYSTEM_IDENTIFIER:-0}"
    command: ["node", "dist-maintenance/scripts/backfill-idp-credentials.js"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    restart: "no"

  api-maintenance-idp-apply:
    profiles: ["maintenance"]
    image: "arenzyra-api:${ARENZYRA_RELEASE_ID:-unversioned}"
    user: "1000:1000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${IDP_MAINTENANCE_DATABASE_URL:?REQUIRED ENV VARIABLE MISSING: IDP_MAINTENANCE_DATABASE_URL}"
      IDP_CREDENTIAL_ENCRYPTION_KEY: "${IDP_CREDENTIAL_ENCRYPTION_KEY:?REQUIRED ENV VARIABLE MISSING: IDP_CREDENTIAL_ENCRYPTION_KEY}"
      ARENZYRA_EXPECTED_DATABASE_NAME: "${ARENZYRA_EXPECTED_DATABASE_NAME:-UNSEALED}"
      ARENZYRA_EXPECTED_DATABASE_OID: "${ARENZYRA_EXPECTED_DATABASE_OID:-0}"
      ARENZYRA_EXPECTED_DATABASE_SYSTEM_IDENTIFIER: "${ARENZYRA_EXPECTED_DATABASE_SYSTEM_IDENTIFIER:-0}"
    command:
      [
        "node",
        "dist-maintenance/scripts/backfill-idp-credentials.js",
        "--apply",
        "--writers-stopped",
        "--confirm=BACKFILL_IDP_CREDENTIALS",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    restart: "no"

  api-maintenance-idp-validate:
    profiles: ["maintenance"]
    image: "arenzyra-api:${ARENZYRA_RELEASE_ID:-unversioned}"
    user: "1000:1000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?REQUIRED ENV VARIABLE MISSING: MIGRATION_DATABASE_URL}"
      IDP_CREDENTIAL_ENCRYPTION_KEY: "${IDP_CREDENTIAL_ENCRYPTION_KEY:?REQUIRED ENV VARIABLE MISSING: IDP_CREDENTIAL_ENCRYPTION_KEY}"
      ARENZYRA_EXPECTED_DATABASE_NAME: "${ARENZYRA_EXPECTED_DATABASE_NAME:-UNSEALED}"
      ARENZYRA_EXPECTED_DATABASE_OID: "${ARENZYRA_EXPECTED_DATABASE_OID:-0}"
      ARENZYRA_EXPECTED_DATABASE_SYSTEM_IDENTIFIER: "${ARENZYRA_EXPECTED_DATABASE_SYSTEM_IDENTIFIER:-0}"
    command:
      [
        "node",
        "dist-maintenance/scripts/validate-idp-envelope-constraint.js",
        "validate",
        "--writers-stopped",
        "--confirm=VALIDATE_IDP_ENVELOPE_CONSTRAINT",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=1000,gid=1000
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    logging: *default-logging
    restart: "no"

  media-ai:
    image: "arenzyra-media-ai:${ARENZYRA_RELEASE_ID:-unversioned}"
    build:
      context: ../apps/media-ai-service
      dockerfile: Dockerfile
      args:
        ARENZYRA_RELEASE_ID: "${ARENZYRA_RELEASE_ID:-}"
        ARENZYRA_SOURCE_DIGEST: "${ARENZYRA_SOURCE_DIGEST:-}"
        ARENZYRA_GIT_COMMIT: "${ARENZYRA_GIT_COMMIT:-}"
        ARENZYRA_BUILD_AT: "${ARENZYRA_BUILD_AT:-}"
        ARENZYRA_BUILD_SOURCE: "${ARENZYRA_BUILD_SOURCE:-publish}"
    environment:
      U2NET_HOME: /models
      MEDIA_AI_REQUIRE_PRELOADED_MODELS: "true"
      MEDIA_AI_MODEL_MANIFEST_PATH: /models/manifest.sha256
      MEDIA_AI_MAX_IMAGE_PIXELS: "${MEDIA_AI_MAX_IMAGE_PIXELS:-25000000}"
      MEDIA_AI_MAX_CONCURRENT_JOBS: "${MEDIA_AI_MAX_CONCURRENT_JOBS:-2}"
      MEDIA_AI_MAX_QUEUED_JOBS: "${MEDIA_AI_MAX_QUEUED_JOBS:-4}"
      MEDIA_AI_QUEUE_TIMEOUT_SECONDS: "${MEDIA_AI_QUEUE_TIMEOUT_SECONDS:-5}"
      MEDIA_AI_ADMISSION_TIMEOUT_SECONDS: "${MEDIA_AI_ADMISSION_TIMEOUT_SECONDS:-0.05}"
      MEDIA_AI_JOB_TIMEOUT_SECONDS: "${MEDIA_AI_JOB_TIMEOUT_SECONDS:-45}"
    volumes:
      - media-ai-models:/models
    expose:
      - "5055"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5055/health/ready', timeout=3).read()",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *default-logging
    restart: unless-stopped

  web:
    image: "arenzyra-web:${ARENZYRA_RELEASE_ID:-unversioned}"
    build:
      context: ..
      dockerfile: apps/arenzyra-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?REQUIRED ENV VARIABLE MISSING: NEXT_PUBLIC_API_URL}"
        ARENZYRA_BUILD_ID: "${ARENZYRA_BUILD_ID:-}"
        ARENZYRA_GIT_COMMIT: "${ARENZYRA_GIT_COMMIT:-}"
        ARENZYRA_BUILD_AT: "${ARENZYRA_BUILD_AT:-}"
        ARENZYRA_BUILD_SOURCE: "${ARENZYRA_BUILD_SOURCE:-publish}"
        ARENZYRA_BUILD_DIRTY: "${ARENZYRA_BUILD_DIRTY:-unknown}"
        ARENZYRA_RELEASE_ID: "${ARENZYRA_RELEASE_ID:-}"
        ARENZYRA_SOURCE_DIGEST: "${ARENZYRA_SOURCE_DIGEST:-}"
    labels:
      com.arenzyra.release-id: "${ARENZYRA_RELEASE_ID:-unknown}"
      com.arenzyra.source-digest: "${ARENZYRA_SOURCE_DIGEST:-unknown}"
      com.arenzyra.release-source: "${ARENZYRA_BUILD_SOURCE:-publish}"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:?REQUIRED ENV VARIABLE MISSING: NEXT_PUBLIC_API_URL}"
      INTERNAL_API_URL: "${INTERNAL_API_URL:-http://api:3000}"
      # Server-only, optional signed launcher release metadata. An empty value
      # intentionally leaves every launcher download link unavailable.
      ARENZYRA_LAUNCHER_RELEASE_JSON: "${ARENZYRA_LAUNCHER_RELEASE_JSON:-}"
      STUDIO_DATABASE_URL: "${STUDIO_DATABASE_URL:?REQUIRED ENV VARIABLE MISSING: STUDIO_DATABASE_URL}"
      STUDIO_DATABASE_SSL: "${STUDIO_DATABASE_SSL:-}"
      STUDIO_DATABASE_POOL_SIZE: "${STUDIO_DATABASE_POOL_SIZE:-}"
      STUDIO_MEDIA_SIGNING_SECRET: "${STUDIO_MEDIA_SIGNING_SECRET:?REQUIRED ENV VARIABLE MISSING: STUDIO_MEDIA_SIGNING_SECRET}"
      MEDIA_AI_URL: "${MEDIA_AI_URL:-http://media-ai:5055}"
      STUDIO_MEDIA_AI_URL: "${STUDIO_MEDIA_AI_URL:-}"
      STUDIO_MEDIA_AI_TIMEOUT_MS: "${STUDIO_MEDIA_AI_TIMEOUT_MS:-}"
      STUDIO_REMOVE_BG_API_KEY: "${STUDIO_REMOVE_BG_API_KEY:-}"
      STUDIO_REMOVE_BG_API_URL: "${STUDIO_REMOVE_BG_API_URL:-}"
      STUDIO_REMOVE_BG_SIZE: "${STUDIO_REMOVE_BG_SIZE:-}"
      STUDIO_REMOVE_BG_TYPE: "${STUDIO_REMOVE_BG_TYPE:-}"
      STUDIO_ALLOW_LOCAL_DEV_WORKSPACE: "${STUDIO_ALLOW_LOCAL_DEV_WORKSPACE:-0}"
      OBSERVER_BASE_URL: "${OBSERVER_BASE_URL:-http://host.docker.internal:10086}"
      # Direct observer access is intentionally unsupported in the public web
      # container. The authenticated desktop bridge is the production path.
      ARENZYRA_WEB_ALLOW_OBSERVER_DIRECT: "0"
      ARENZYRA_WEB_OBSERVER_LOCAL_PROBE: "0"
      PORT: 3005
    depends_on:
      api:
        condition: service_healthy
      studio-migrate:
        condition: service_completed_successfully
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3005"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/.next-build/cache:rw,noexec,nosuid,size=256m,uid=1000,gid=1000,mode=0770
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    restart: unless-stopped

  studio-migrate:
    profiles: ["migration"]
    image: "arenzyra-web:${ARENZYRA_RELEASE_ID:-unversioned}"
    environment:
      NODE_ENV: production
      STUDIO_MIGRATION_DATABASE_URL: "${STUDIO_MIGRATION_DATABASE_URL:?REQUIRED ENV VARIABLE MISSING: STUDIO_MIGRATION_DATABASE_URL}"
      STUDIO_DATABASE_SSL: "${STUDIO_DATABASE_SSL:-}"
      STUDIO_DATABASE_CA: "${STUDIO_DATABASE_CA:-}"
    command: ["node", "scripts/migrate-studio-postgres.cjs"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    restart: "no"

  discord-bot:
    # The Discord gateway bot must be a single production truth. Keep this
    # local publish service opt-in so deploys cannot start a second bot.
    profiles: ["discord-bot"]
    image: "arenzyra-discord-bot:${ARENZYRA_RELEASE_ID:-unversioned}"
    build:
      context: ..
      dockerfile: apps/discord-bot/Dockerfile
      args:
        ARENZYRA_RELEASE_ID: "${ARENZYRA_RELEASE_ID:-}"
        ARENZYRA_SOURCE_DIGEST: "${ARENZYRA_SOURCE_DIGEST:-}"
        ARENZYRA_GIT_COMMIT: "${ARENZYRA_GIT_COMMIT:-}"
        ARENZYRA_BUILD_AT: "${ARENZYRA_BUILD_AT:-}"
        ARENZYRA_BUILD_SOURCE: "${ARENZYRA_BUILD_SOURCE:-publish}"
    environment:
      NODE_ENV: production
      ARENZYRA_DISCORD_BOT_INSTANCE: "${ARENZYRA_DISCORD_BOT_INSTANCE:?REQUIRED ENV VARIABLE MISSING: ARENZYRA_DISCORD_BOT_INSTANCE}"
      ARENZYRA_DISCORD_STATE_DIR: "/var/lib/arenzyra-discord-bot"
      ARENZYRA_API_BASE_URL: "http://api:3000"
      ARENZYRA_API_SERVICE_TOKEN: "${ARENZYRA_API_SERVICE_TOKEN:?REQUIRED ENV VARIABLE MISSING: ARENZYRA_API_SERVICE_TOKEN}"
      ARENZYRA_API_ORGANIZATION_ID: "${ARENZYRA_API_SERVICE_ORGANIZATION_ID:?REQUIRED ENV VARIABLE MISSING: ARENZYRA_API_SERVICE_ORGANIZATION_ID}"
      ARENZYRA_API_REQUEST_TIMEOUT_MS: "${ARENZYRA_API_REQUEST_TIMEOUT_MS:-10000}"
      ARENZYRA_API_MAX_IDEMPOTENT_RETRIES: "${ARENZYRA_API_MAX_IDEMPOTENT_RETRIES:-2}"
      ARENZYRA_MEDIA_ALLOWED_ORIGINS: "${ARENZYRA_MEDIA_ALLOWED_ORIGINS:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:?REQUIRED ENV VARIABLE MISSING: DISCORD_BOT_TOKEN}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:?REQUIRED ENV VARIABLE MISSING: DISCORD_CLIENT_ID}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-}"
      DISCORD_MESSAGE_CONTENT_INTENT: "${DISCORD_MESSAGE_CONTENT_INTENT:-true}"
      DISCORD_GUILD_MEMBERS_INTENT: "${DISCORD_GUILD_MEMBERS_INTENT:-false}"
      DISCORD_REGISTER_GLOBAL_COMMANDS: "${DISCORD_REGISTER_GLOBAL_COMMANDS:-true}"
    labels:
      com.arenzyra.release-id: "${ARENZYRA_RELEASE_ID:-unknown}"
      com.arenzyra.source-digest: "${ARENZYRA_SOURCE_DIGEST:-unknown}"
      com.arenzyra.release-source: "${ARENZYRA_BUILD_SOURCE:-publish}"
    volumes:
      - discord-bot-state:/var/lib/arenzyra-discord-bot
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');try{const age=Date.now()-fs.statSync('/tmp/arenzyra-discord-gateway.ready').mtimeMs;process.exit(age<45000?0:1)}catch{process.exit(1)}",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging: *default-logging
    restart: unless-stopped

volumes:
  api-storage:
  api-uploads:
  caddy-config:
  caddy-data:
  media-ai-models:
  postgres-data:
  redis-data:
  discord-bot-state:

networks:
  default:
    ipam:
      config:
        - subnet: "${ARENZYRA_DOCKER_SUBNET:-172.30.50.0/24}"
