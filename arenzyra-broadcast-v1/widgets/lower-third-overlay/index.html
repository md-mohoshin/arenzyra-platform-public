<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arenzyra Lower Third Overlay</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="lower-third" id="lowerThird">
      <section class="lower-third__panel" aria-live="polite">
        <div class="lower-third__copy">
          <p class="lower-third__eyebrow" id="lowerThirdEyebrow">Tournament Feed</p>
          <h1 class="lower-third__title" id="lowerThirdTitle">Arenzyra Summer Invitational 2026</h1>
        </div>

        <div class="lower-third__brand">
          <span class="lower-third__brand-label">Presented by</span>
          <div class="lower-third__logo-shell" id="logoShell">
            <img id="brandLogo" src="../assets/channel-logo.svg" alt="Brand logo" draggable="false" />
          </div>
          <span class="lower-third__brand-name" id="brandName">Arenzyra Broadcast</span>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
